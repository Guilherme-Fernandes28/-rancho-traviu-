<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Cardápio | Rancho Traviú</title>
<link rel="icon" href="logo.webp">
<meta name="description" content="Cardápio do Rancho Traviú, Jundiaí.">
<meta property="og:title" content="Cardápio | Rancho Traviú">
<meta property="og:description" content="Porções, bebidas e drinks. Sábados, domingos e feriados, das 11h às 18h.">
<meta property="og:image" content="https://guilherme-fernandes28.github.io/rancho-traviu/logo.webp">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:64px;color-scheme:dark;-webkit-text-size-adjust:100%}
body{background:#000;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a{color:inherit;text-decoration:none}
.topo{text-align:center;padding:calc(44px + env(safe-area-inset-top)) 20px 30px}
.topo img{width:120px;height:120px;border-radius:50%}
.topo h1{font-size:34px;font-weight:700;letter-spacing:-.02em;margin-top:18px}
.topo>p{color:#a1a1a6;font-size:17px}
.selos{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.selos span{background:#1c1c1e;color:#a1a1a6;font-size:13px;padding:6px 12px;border-radius:999px}
nav{position:sticky;top:0;z-index:2;background:#000;display:flex;gap:6px;overflow-x:auto;padding:10px max(14px,calc(50% - 300px));border-bottom:1px solid #1c1c1e;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav a{flex:none;color:#a1a1a6;font-size:15px;font-weight:500;padding:7px 15px;border-radius:999px}
nav a.ativo{background:#f5f5f7;color:#000}
nav a,.zap{touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .1s ease-out}
nav a:active,.zap:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){nav a:not(.ativo):hover{color:#f5f5f7}}
main{max-width:640px;margin:auto;padding:0 16px}
h2{font-size:26px;font-weight:700;letter-spacing:-.015em;padding:38px 4px 12px}
.lista{background:#1c1c1e;border-radius:16px;padding:0 16px}
.item{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:14px 0;border-bottom:1px solid #2c2c2e}
.item:last-child{border:0}
.item h3{font-size:16px;font-weight:500}
.item p{color:#8e8e93;font-size:14px;margin-top:1px}
.preco{font-weight:600;white-space:nowrap;text-align:right}
.preco small{display:block;font-size:11px;font-weight:400;color:#8e8e93}
.precos{display:flex;gap:16px}
footer{max-width:640px;margin:56px auto 0;padding:0 20px calc(44px + env(safe-area-inset-bottom));text-align:center;color:#a1a1a6;font-size:15px}
footer p{margin-bottom:6px}
footer a{text-decoration:underline;text-underline-offset:3px}
.botoes{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.zap{display:inline-block;min-width:140px;border:1px solid #f5f5f7;background:#f5f5f7;color:#000;text-decoration:none!important;font-weight:600;padding:12px 28px;border-radius:999px}
.insta{background:none;color:#f5f5f7;border-color:#424245}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
</style>
</head>
<body>
<header class="topo">
<img src="logo.webp" alt="Rancho Traviú Bar e Grill">
<h1>Cardápio</h1>
<p>Rancho Traviú</p>
<div class="selos"><span>Fogão a lenha</span><span>Cerveja gelada</span><span>Pet friendly</span></div>
</header>
<nav id="menu" aria-label="Categorias"></nav>
<main id="cardapio"></main>
<footer>
<p>Sábados, domingos e feriados, das 11h às 18h</p>
<p><a href="https://www.google.com/maps/search/?api=1&query=Avenida+Salvador+Kruppe+199+Traviú+Jundiaí" target="_blank">Av. Salvador Kruppe, 199, Traviú, Jundiaí</a></p>
<div class="botoes"><a class="zap" href="https://wa.me/5511996773369" target="_blank">WhatsApp</a><a class="zap insta" href="https://www.instagram.com/ranchotraviu_jundiai/" target="_blank">Instagram</a></div>
</footer>
<script>
const cardapio=[
{categoria:"Bebidas",itens:[
["Cerveja Heineken 600 ml", "21,00"],
["Brahma/Skol/Antarctica", "15,00"],
["Cerveja Original/Spaten", "19,00"],
["Cerveja Amstel", "16,00"]
]},
{categoria:"Cerveja lata",itens:[
["Brahma/Skol 350 ml", "8,00"],
["Heineken 350 ml", "14,00"]
]},
{categoria:"Chopp",itens:[
["Chopp Brahma 350 ml", "13,00"],
["Chopp Black 350 ml", "16,00"],
["Chopp IPA 350 ml", "18,00"],
["Chopp Vinho", "18,00"]
]},
{categoria:"Refrigerante lata",itens:[
["Coca-Cola/Fanta/Sprite/Guaraná", "8,00"],
["Água tônica 350 ml", "8,00"],
["Água com gás/Água sem gás", "5,00"],
["H2O", "10,00"]
]},
{categoria:"Suco",itens:[
["Suco", "12,00", "Abacaxi, morango, maracujá ou limão"],
["Suco de uva", "14,00"]
]},
{categoria:"Destilados",itens:[
["Campari/Vodka", "20,00"],
["Pinga da casa", "5,00"],
["Seleta", "6,00"],
["Whisky", "20,00"],
["Whisky Black", "35,00"]
]},
{categoria:"Drinks",itens:[
["Caipirinha", "28,00", "Pinga, vodka ou saquê"],
["Gim tônica", "30,00"]
]},
{categoria:"Porções de peixe",itens:[
["Tilápia frita", ["65,00", "40,00"]]
]},
{categoria:"Porções de massa",itens:[
["Nhoque caseiro 500 g", "48,00"]
]},
{categoria:"Porções fritas",itens:[
["Batata frita", ["38,00", "25,00"]],
["Polenta frita tradicional", ["38,00", "25,00"]],
["Polenta recheada", ["38,00", "25,00"], "Queijo ou calabresa"],
["Pastelzinho", ["40,00", "25,00"], "Queijo ou carne"],
["Linguiça frita", ["60,00", "40,00"]],
["Frango frito", ["48,00", "35,00"]],
["Isca de frango", ["48,00", "35,00"]],
["Torresmo de rolo", ["65,00", "40,00"]],
["Mandioca frita", ["38,00", "25,00"]]
]},
{categoria:"Porções mini salgados",itens:[
["Coxinha", "35,00"],
["Bolinha de queijo", "35,00"],
["Croquete", "35,00"]
]},
{categoria:"Guarnições",itens:[
["Arroz", "18,00"],
["Feijão", "18,00"],
["Salada", "18,00"]
]},
{categoria:"Refeição",itens:[
["Self service", "Consulte-nos"]
]},
{categoria:"Assados",itens:[
["Costela", "75,00"]
]}
]
const real=v=>/\d/.test(v)?"R$ "+v:v
const precos=p=>Array.isArray(p)?`<div class="precos"><span class="preco">${real(p[0])}<small>Inteira</small></span><span class="preco">${real(p[1])}<small>Meia</small></span></div>`:`<span class="preco">${real(p)}</span>`
document.getElementById("cardapio").innerHTML=cardapio.map((c,i)=>`<section id="c${i}"><h2>${c.categoria}</h2><div class="lista">${c.itens.map(([n,p,d])=>`<div class="item"><div><h3>${n}</h3>${d?`<p>${d}</p>`:""}</div>${precos(p)}</div>`).join("")}</div></section>`).join("")
const menu=document.getElementById("menu")
menu.innerHTML=cardapio.map((c,i)=>`<a href="#c${i}">${c.categoria}</a>`).join("")
const links=[...menu.children]
const secoes=[...document.querySelectorAll("main section")]
let atual,fixo
const marcar=()=>{
const fim=innerHeight+scrollY>=document.documentElement.scrollHeight-2
const s=fixo||(fim?secoes.at(-1):secoes.filter(s=>s.getBoundingClientRect().top<=80).pop()||secoes[0])
if(s==atual)return
atual=s
links.forEach(a=>a.classList.toggle("ativo",a.hash=="#"+s.id))
menu.scrollTo({left:menu.querySelector(".ativo").offsetLeft-14,behavior:"smooth"})
}
addEventListener("scroll",marcar,{passive:true})
menu.onclick=e=>{fixo=document.querySelector(e.target.hash);marcar()}
for(const t of ["wheel","touchstart","keydown"])addEventListener(t,()=>fixo=null,{passive:true})
marcar()
</script>
</body>
</html>
